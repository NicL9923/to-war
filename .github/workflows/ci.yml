name: Build and import
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Install pinned tools
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLo godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip
          echo '129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247  godot.zip' | sha256sum -c -
          unzip -q godot.zip -d godot
          curl -fsSLo blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.3-linux-x64.tar.xz
          echo '78486c018b4443efe5e75ab54c290ed8c15abafd249b862c2c9ce2530a918eec  blender.tar.xz' | sha256sum -c -
          tar -xf blender.tar.xz
          touch godot/Godot_v4.7.2-stable_mono_linux_x86_64/_sc_
      - name: Build, import, and smoke test
        env:
          GODOT: ${{ runner.temp }}/godot/Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64
          BLENDER: ${{ runner.temp }}/blender-5.2.3-linux-x64/blender
        run: python3 .agents/tools/validate.py
